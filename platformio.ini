; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library op  tions: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

; ESP32-C3 Mini competition firmware.
[env:esp32-c3-devkitm-1]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

build_src_filter =
    +<main.cpp>
    +<robot/>

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ROBOT_TARGET_C3_SUPERMINI
    ; Route Arduino Serial to the ESP32-C3's native USB CDC/JTAG controller,
    ; not UART0 on the motor-direction GPIO20/GPIO21 pins.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Isolated Viper X16 hardware diagnostic. It configures only the sensor mux
; select lines and ADC input; no motor-driver pins are touched.
[env:esp32-c3-viper-test]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_src_filter =
    -<*>
    +<viper_array_test.cpp>

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ROBOT_TARGET_C3_SUPERMINI
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
